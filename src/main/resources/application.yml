application:
  description: t-bank handle data series into signals
  api:
    version: v1

spring:
  application:
    name: t-bank-signal-service

server:
  port: 8089
  servlet:
    context-path: /ta

eureka:
  client:
    registerWithEureka: false
    fetchRegistry: false
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}


signal:
  live-time-minutes: 10

cron:
  disable: "-"
  task:
    2H: "0 */20 9-23 * * 1-5"
    4H: "0 */15 9-23 * * 1-7"
    1D: "0 */15 9-23 * * 1-7"
    1W: "0 */20 9-23 * * 1-5"
