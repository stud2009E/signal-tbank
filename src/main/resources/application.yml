server:
  port: 8089
  servlet:
    context-path: /ta

spring:
  application:
    name: t-bank-signal-service
    description: t-bank handle data series into signals
  config:
    import:
      - classpath:app-config.yml

eureka:
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}

signal:
  live-time-minutes: 10
